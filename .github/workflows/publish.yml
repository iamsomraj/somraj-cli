name: Publish

# Publishes to npm when a GitHub release is created. Uses npm trusted
# publishing (OIDC), so no npm token is stored in the repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Skip versions that are already on npm
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "somraj@$version" version >/dev/null 2>&1; then
            echo "somraj@$version is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

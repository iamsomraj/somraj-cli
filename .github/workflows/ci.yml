name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format
      - name: Print the card and every section
        run: node bin/somraj.js | tee output.txt && grep -q 'EXPERIENCE' output.txt
      - name: Fall back to the bundled snapshot when offline
        run: node bin/somraj.js | grep -q 'Somraj Mukherjee'
        env:
          SOMRAJ_PROFILE_URL: http://127.0.0.1:9/profile.json
      - name: Check the package contents
        run: npm pack --dry-run
